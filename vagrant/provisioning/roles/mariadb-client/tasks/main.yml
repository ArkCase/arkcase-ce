- name: configure MariaDB v10 repository (CentOS 7)
  become: yes
  copy:
    dest: /etc/yum.repos.d/mariadb.repo
    force: yes
    content: |
      # MariaDB 10.4 RedHatEnterpriseLinux repository list - created 2023-03-01 19:04 UTC
      # https://mariadb.org/download/
      [mariadb]
      name = MariaDB
      baseurl = http://yum.mariadb.org/10.11/centos7-amd64
      gpgkey=https://yum.mariadb.org/RPM-GPG-KEY-MariaDB
      gpgcheck=1
  when: ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"] == "7"

- name: configure MariaDB v10 repository (RHEL 8)
  become: yes
  copy:
    dest: /etc/yum.repos.d/mariadb.repo
    force: yes
    content: |
      [mariadb]
      name = MariaDB
      baseurl = https://rpm.mariadb.org/10.11/rhel/$releasever/$basearch
      gpgkey= https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB
      gpgcheck=1
      module_hotfixes=1
  when: ansible_facts["distribution"] == "RedHat" and ansible_facts["distribution_major_version"] == "8"

- name: configure MariaDB v10 repository (Rocky 8)
  become: yes
  copy:
    dest: /etc/yum.repos.d/mariadb.repo
    force: yes
    content: |
      # MariaDB 10.4 RedHat repository list - created  2022-01-07
      # https://mariadb.org/download/
      [mariadb]
      name = MariaDB
      baseurl = http://yum.mariadb.org/10.11/rhel8-amd64
      module_hotfixes=1
      gpgkey=https://yum.mariadb.org/RPM-GPG-KEY-MariaDB
      gpgcheck=1
  when: ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"] == "8"

- name: MySQL python package name (CentOS 7)
  set_fact:
    pkg_mysql_python: MySQL-python
  when: ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"] == "7"

- name: MySQL python package name (RHEL 8)
  set_fact:
    pkg_mysql_python: pymysql
  when: ansible_facts["distribution"] in ["RedHat","Rocky"] and ansible_facts["distribution_major_version"] == "8"

- name: install MariaDB packages (CentOS 7)
  become: yes
  command: dnf install -y --nogpgcheck MariaDB-server MariaDB-client
  register: mariadb_install
  when: ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"] == "7"

- name: install MariaDB packages (RHEL 8)
  become: yes
  command: dnf install -y --enablerepo mariadb --disablerepo rhel-8-for-x86_64-appstream-rpms MariaDB-server MariaDB-client
  register: mariadb_install
  when: ansible_facts["distribution"] == "RedHat" and ansible_facts["distribution_major_version"] == "8"

- name: install MariaDB packages (Rocky 8)
  become: yes
  command: dnf install -y --enablerepo mariadb MariaDB-server MariaDB-client
  register: mariadb_install
  when: ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"] == "8"

- name: install MariaDB python library
  become: yes
  command: "{{ pip_executable }} install --upgrade {{ pkg_mysql_python }}"

- include_tasks: "{{ role_path }}/../common/tasks/download.yml"
  loop:
    - name: "MariaDB JDBC Driver"
      dest: "{{ root_folder }}/common/mariadb-java-client-{{ mariadb_jdbc_version }}.jar"
      owner: "root"
      url: "https://dlm.mariadb.com/4765303/Connectors/java/connector-java-{{ mariadb_jdbc_version }}/mariadb-java-client-{{ mariadb_jdbc_version }}.jar"

- name: ensure root user can login via tcp when database is local
  become: yes
  mysql_user:
    login_unix_socket: "{{ mariadb_data_folder }}/mysql.sock"
    host: "{{ internal_host_ip | default(ansible_facts['default_ipv4.address'] | default(ansible_facts['all_ipv4_addresses'][0])) }}"
    name: "root"
    password: "{{ database_root_password }}"
    tls_requires:
      SSL:
    priv: '*.*:ALL'
    state: present
  when: internal_host == database_host

- name: create database schemas
  include_tasks: "{{ role_path }}/../mariadb/tasks/create_schema.yml"
  loop:
    - "{{ database_arkcase_user | default('arkcase') }}"
    - "{{ database_alfresco_user | default('alfresco') }}"
    - "{{ database_activemq_user | default('activemq') }}"
    - "{{ database_pentaho_hibernate_user | default('hibuser') }}"
    - "{{ database_pentaho_jackrabbit_user | default('jcr_user') }}"
    - "{{ database_pentaho_quartz_user | default('pentaho_user') }}"
