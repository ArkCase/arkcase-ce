###################################################
# Get the analytical reports project and unzip it
###################################################

- name: Set report facts
  ansible.builtin.set_fact:
    foia_analytical_reports_version_formatted: "{{ '-' ~ foia_analytical_reports_version if foia_analytical_reports_version != '' else '' }}"
    doj_reports_repository_id: "arkcase"
    doj_reports_group_id: "com.armedia.arkcase.reports.dw"
    doj_reports_artifact_id: "foia-analytical"
    database_port: "{{ '3306' if 'mariadb' == db_engine else '5432' }}"

- name: set derived report facts
  ansible.builtin.set_fact:
    etl_download_path: "{{ doj_reports_artifact_id }}{{ foia_analytical_reports_version_formatted }}.jar"
    reports_download_path: "{{ doj_reports_artifact_id }}{{ foia_analytical_reports_version_formatted }}-reports.zip"

- name: Create DOJ backup folder with timestamp
  set_fact:
    doj_backup_folder_path: "{{ root_folder }}/install/pentaho/doj-backup-{{ ansible_date_time.iso8601 }}"

- name: Ensure common group exists
  become: true
  ansible.builtin.group:
    name: pentaho_group
    state: present

- name: Add users to group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: pentaho_group
    append: yes
  loop:
    - pentaho
    - pentaho-pdi
 
- name: Create backup directory
  become: true
  file:
    path: "{{ doj_backup_folder_path }}"
    state: directory
    owner: pentaho
    group: pentaho
    mode: '0755'
 
- name: Backup existing DOJ files if present
  become: true
  command: mv "{{ item }}" "{{ doj_backup_folder_path }}/"
  args:
    removes: "{{ item }}"
  loop:
    - "{{ root_folder }}/install/pentaho/{{ etl_download_path }}"
    - "{{ root_folder }}/install/pentaho/{{ reports_download_path }}"
    - "{{ root_folder }}/install/pentaho/foia-reports-dw{{ foia_analytical_reports_version_formatted }}"

- name: Create install folder
  become: true
  ansible.builtin.file:
    path: "{{ root_folder }}/install/pentaho/foia-reports-dw{{ foia_analytical_reports_version_formatted }}"
    owner: pentaho
    group: pentaho_group
    mode: '2775'
    state: directory

- name: install python modules needed by maven_artifacts
  become: yes
  command: "{{ ansible_pip3 | default('pip3') }} install lxml"

- name: Download FOIA reports ETL job repository
  become: yes
  become_user: pentaho
  maven_artifact:
    repository_url: "{{ maven_repository_url }}/{{ doj_reports_repository_id }}/"
    group_id: "{{ doj_reports_group_id }}"
    artifact_id: "{{ doj_reports_artifact_id }}"
    version: "{{ foia_analytical_reports_version }}"
    extension: jar
    dest: "{{ root_folder }}/install/pentaho"
    keep_name: true
    username: "{{ maven_repository_username }}"
    password: "{{ maven_repository_password }}"

- name: Download FOIA analytical reports repository
  become: yes
  become_user: pentaho
  maven_artifact:
    repository_url: "{{ maven_repository_url }}/{{ doj_reports_repository_id }}/"
    group_id: "{{ doj_reports_group_id }}"
    artifact_id: "{{ doj_reports_artifact_id }}"
    classifier: "reports"
    version: "{{ foia_analytical_reports_version }}"
    extension: jar
    dest: "{{ root_folder }}/install/pentaho/{{ reports_download_path }}"
    keep_name: true
    username: "{{ maven_repository_username }}"
    password: "{{ maven_repository_password }}"

- name: Unzip ETL repository
  become: true
  become_user: pentaho
  ansible.builtin.unarchive:
    remote_src: true
    src: "{{ root_folder }}/install/pentaho/{{ etl_download_path }}"
    dest: "{{ root_folder }}/install/pentaho/foia-reports-dw{{ foia_analytical_reports_version_formatted }}"
    owner: pentaho
    group: pentaho_group
    mode: '2775'


