- name: Check if MongoDB pass_db user exists
  command: >-
    mongo admin --eval "db.getUser('{{ microservice_mongodb_username }}')"
  register: mongodb_pass_db
- debug: msg="{{mongodb_pass_db.stdout}}"

- name: Create pass_db user
  when: mongodb_pass_db.stdout.find('userId') == -1
  command: >-
    mongo admin --eval "db.createUser({user: 'pass_db', pwd: '{{ default_user_password }}', roles: [{ role: 'readWrite', db: 'pass_db' }]})"
