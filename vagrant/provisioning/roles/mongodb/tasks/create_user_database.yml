- name: Check if MongoDB root user siteRootAdmin exists
  command: >-
    mongo admin --eval "db.getUser('arkcase')"
  register: mongodb_siteRootAdmin
- debug: msg="{{mongodb_siteRootAdmin.stdout}}"

- name: Create MongoDB root user siteRootAdmin
  when: mongodb_siteRootAdmin.stdout.find('userId') == -1
  command: >-
    mongo admin --eval "db.createUser({user: 'arkcase', pwd: '{{ default_user_password }}', roles: [{ role: 'root', db: 'admin' }]})"

