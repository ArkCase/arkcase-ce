- name: Check if MongoDB administrative user siteUserAdmin exists
  command: >-
    mongo admin --eval "db.getUser('{{ microservice_mongodb_username }}')"
  register: mongodb_siteUserAdmin
- debug: msg="{{mongodb_siteUserAdmin.stdout}}"

- name: Create MongoDB administrative user siteUserAdmin
  when: mongodb_siteUserAdmin.stdout.find('userId') == -1
  command: >-
    mongo admin --eval "db.createUser({user: '{{ microservice_mongodb_username }}', pwd: '{{ microservice_mongodb_password }}', roles: [{ role: 'readWrite', db: '{{ microservice_mongodb_database }}' }, { role: 'readWrite', db: 'admin' }]})"

